server:
  port: 8003

spring:
  application:
    name: reservation-service

  datasource:
    url: jdbc:postgresql://${RES_DB_HOST:localhost}:${RES_DB_PORT:5432}/${RES_DB_NAME:reservations_db}
    username: ${RES_DB_USER:postgres}
    password: ${RES_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  cloud:
    openfeign:
      enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
            logger-level: BASIC

jwt:
  secret: ${JWT_SECRET:coworking_jwt_secret_2024_secure_key}

space:
  service:
    url: ${SPACE_SERVICE_URL:http://space-service:8002}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.coworking.reservations: INFO
    org.springframework.security: WARN
    feign: INFO
