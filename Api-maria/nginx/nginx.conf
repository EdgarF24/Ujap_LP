# ─────────────────────────────────────────────────────────────────────────────
# Nginx API Gateway — Co-working Microservices
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
# 10 req/s for auth endpoints  (burst up to 20)
# 30 req/s for all other API   (burst up to 60)
limit_req_zone $binary_remote_addr zone=auth_zone:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m     rate=30r/s;

# Upstream definitions
upstream auth_service {
    server auth-service:8001;
    keepalive 32;
}

upstream space_service {
    server space-service:8002;
    keepalive 32;
}

upstream reservation_service {
    server reservation-service:8003;
    keepalive 32;
}

# ─────────────────────────────────────────────────────────────────────────────
# Main HTTP server block
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Common timeouts
    proxy_connect_timeout       30s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    send_timeout                60s;

    # Buffer tuning
    proxy_buffer_size           16k;
    proxy_buffers               4 16k;
    proxy_busy_buffers_size     32k;

    # ── Global proxy headers (applied to all locations) ──────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";   # enable keepalive to upstreams

    # ── CORS helper macro ────────────────────────────────────────────────────
    # Applied per-location block below via add_header directives
    # (nginx does not support map-based add_header in location easily, so we
    #  apply them explicitly in each location)

    # ── Gateway health-check ─────────────────────────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # ── OPTIONS pre-flight (global catch-all) ────────────────────────────────
    # Returns 204 immediately for any OPTIONS request so browsers don't time out
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      '*' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Request-ID' always;
            add_header 'Access-Control-Max-Age'           1728000;
            add_header 'Content-Type'                     'text/plain charset=UTF-8';
            add_header 'Content-Length'                   0;
            return 204;
        }

        return 404 '{"error":"not_found","message":"Route not found"}';
        add_header Content-Type application/json;
    }

    # =========================================================================
    # /api/auth/  →  auth-service:8001
    # Rate limit: 10 req/s, burst 20
    # =========================================================================
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        limit_req_status 429;

        # CORS
        add_header 'Access-Control-Allow-Origin'  '*'                                                  always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'             always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Request-ID'  always;

        proxy_pass http://auth_service/api/auth/;
    }

    # =========================================================================
    # /api/spaces/  →  space-service:8002
    # Rate limit: 30 req/s, burst 60
    # =========================================================================
    location /api/spaces/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        # CORS
        add_header 'Access-Control-Allow-Origin'  '*'                                                  always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'             always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Request-ID'  always;

        proxy_pass http://space_service/api/spaces/;
    }

    # =========================================================================
    # /api/billing/  →  space-service:8002
    # Rate limit: 30 req/s, burst 60
    # =========================================================================
    location /api/billing/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        # CORS
        add_header 'Access-Control-Allow-Origin'  '*'                                                  always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'             always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Request-ID'  always;

        proxy_pass http://space_service/api/billing/;
    }

    # =========================================================================
    # /api/reports/  →  space-service:8002
    # Rate limit: 30 req/s, burst 60
    # =========================================================================
    location /api/reports/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        # CORS
        add_header 'Access-Control-Allow-Origin'  '*'                                                  always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'             always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Request-ID'  always;

        proxy_pass http://space_service/api/reports/;
    }

    # =========================================================================
    # /api/reservations/  →  reservation-service:8003
    # Rate limit: 30 req/s, burst 60
    # =========================================================================
    location /api/reservations/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        # CORS
        add_header 'Access-Control-Allow-Origin'  '*'                                                  always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS'             always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Request-ID'  always;

        proxy_pass http://reservation_service/api/reservations/;
    }

    # ── Rate-limit error response ────────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        internal;
        add_header Content-Type application/json always;
        return 429 '{"error":"too_many_requests","message":"Rate limit exceeded. Please slow down."}';
    }

    # ── Generic upstream error responses ─────────────────────────────────────
    error_page 502 /502.json;
    location = /502.json {
        internal;
        add_header Content-Type application/json always;
        return 502 '{"error":"bad_gateway","message":"Upstream service unavailable."}';
    }

    error_page 503 /503.json;
    location = /503.json {
        internal;
        add_header Content-Type application/json always;
        return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable."}';
    }

    error_page 504 /504.json;
    location = /504.json {
        internal;
        add_header Content-Type application/json always;
        return 504 '{"error":"gateway_timeout","message":"Upstream service timed out."}';
    }
}
